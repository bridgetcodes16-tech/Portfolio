<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple to-do list app by BRIDGET CODES.">
  <title>To-Do List | BRIDGET CODES</title>
  <style>
    :root {
      --green: #218c55;
      --green-dark: #176b40;
      --ink: #202923;
      --muted: #78827b;
      --line: #e7ece8;
      --surface: #ffffff;
      --page: #f5f7f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 18px;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .brand {
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-align: center;
    }

    .brand span { color: var(--green); }

    .card {
      padding: 32px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(24, 45, 31, 0.045);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 32px);
      letter-spacing: -1px;
    }

    .intro {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .add-form input {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #dce4de;
      border-radius: 7px;
      outline: none;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .add-form input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(33, 140, 85, 0.10);
    }

    button {
      border: 0;
      border-radius: 7px;
      font: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    button:active { transform: translateY(1px); }

    .add-btn {
      min-width: 76px;
      padding: 0 17px;
      background: var(--green);
      color: white;
      font-size: 14px;
      font-weight: 700;
    }

    .add-btn:hover { background: var(--green-dark); }

    .list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 10px 11px 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .task-check {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.4;
    }

    .task.done .task-text {
      color: #929b95;
      text-decoration: line-through;
    }

    .remove-btn {
      flex: 0 0 auto;
      padding: 7px 9px;
      background: #f5f6f5;
      color: #6c756f;
      font-size: 12px;
    }

    .remove-btn:hover {
      background: #fceeee;
      color: #b33c3c;
    }

    .empty {
      padding: 28px 12px;
      border: 1px dashed #dce4de;
      border-radius: 8px;
      color: #87918a;
      font-size: 14px;
      text-align: center;
    }

    .footer {
      margin-top: 20px;
      color: #9aa39d;
      font-size: 11px;
      text-align: center;
    }
    
    a{
      color: green;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      body { padding: 28px 14px; }
      .card { padding: 23px 18px; }
      .add-form { gap: 8px; }
      .add-btn { min-width: 68px; padding: 0 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">BRIDGET <span>CODES</span></div>

    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">My To-Do List</h1>
      <p class="intro">Keep track of the things you need to get done.</p>

      <form class="add-form" id="task-form">
        <input
          id="task-input"
          type="text"
          placeholder="Add a task..."
          aria-label="Task name"
          maxlength="180"
          autocomplete="off"
          required
        >
        <button class="add-btn" type="submit">Add</button>
      </form>

      <ul class="list" id="task-list" aria-live="polite"></ul>
      <div class="empty" id="empty-state">No tasks yet. Add your first task above.</div>
    </section>

    <p class="footer">A simple productivity tool by <a  href="bridget-codes-portfolio.html">BRIDGET CODES</a></p>
  </main>

  <script>
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const list = document.getElementById('task-list');
    const emptyState = document.getElementById('empty-state');

    let tasks = [];

    try {
      tasks = JSON.parse(localStorage.getItem('bridget-codes-tasks')) || [];
      if (!Array.isArray(tasks)) tasks = [];
    } catch {
      tasks = [];
    }

    function saveTasks() {
      localStorage.setItem('bridget-codes-tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      list.innerHTML = '';
      emptyState.hidden = tasks.length > 0;

      tasks.forEach((task) => {
        const item = document.createElement('li');
        item.className = `task${task.completed ? ' done' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.className = 'task-check';
        checkbox.type = 'checkbox';
        checkbox.checked = Boolean(task.completed);
        checkbox.setAttribute('aria-label', `Complete ${task.text}`);
        checkbox.addEventListener('change', () => {
          task.completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        const removeButton = document.createElement('button');
        removeButton.className = 'remove-btn';
        removeButton.type = 'button';
        removeButton.textContent = 'Remove';
        removeButton.setAttribute('aria-label', `Remove ${task.text}`);
        removeButton.addEventListener('click', () => {
          tasks = tasks.filter((currentTask) => currentTask.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, text, removeButton);
        list.appendChild(item);
      });
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text,
        completed: false
      });

      saveTasks();
      renderTasks();
      input.value = '';
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
